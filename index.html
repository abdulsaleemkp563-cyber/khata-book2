<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KHATA PRO PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f5f5f5; }
        .hidden { display: none !important; }
        .flex { display: flex !important; }
        .premium-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .input-premium { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-premium { background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-premium:active { opacity: 0.8; }
        .header-premium { background: #2e7d32; color: white; padding: 15px; }
        .bottom-nav { display: flex; justify-content: space-around; background: white; padding: 10px; border-top: 1px solid #ddd; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; cursor: pointer; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: #2e7d32; }
        .lock-premium { background: #1a1a1a; color: white; }
        .lock-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #facc15; margin: 0 4px; }
        .lock-dot.active { background: #facc15; }
        .modal-premium { background: white; border-radius: 12px; padding: 20px; max-width: 400px; width: 100%; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .client-item { display: flex; align-items: center; padding: 12px; background: white; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .client-avatar { width: 40px; height: 40px; border-radius: 8px; background: #4ade80; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-right: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .dashboard-item { background: white; padding: 10px; border-radius: 8px; text-align: center; }
        .dashboard-item .value { font-size: 20px; font-weight: bold; }
        .dashboard-item .label { font-size: 12px; color: #666; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; font-size: 13px; }
        .col-date { width: 35%; }
        .col-gave { width: 20%; }
        .col-got { width: 20%; }
        .col-balance { width: 25%; }
        .calc-btn { background: #f0f0f0; border: none; padding: 15px; border-radius: 8px; font-size: 20px; cursor: pointer; text-align: center; }
        .calc-btn:active { background: #ddd; }
        #calcDisplay { background: #f5f5f5; padding: 15px; border-radius: 8px; text-align: right; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .color-option { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-option.active { border-color: #facc15; }
        #mainApp { display: none; flex-direction: column; height: 100vh; }
        .header-premium { flex-shrink: 0; }
        .main-content { flex: 1; overflow-y: auto; padding: 10px; }
        .bottom-nav { flex-shrink: 0; }
        @media (max-width: 400px) {
            .dashboard-grid { grid-template-columns: 1fr 1fr; gap: 5px; }
            .client-item { padding: 8px; }
            .client-avatar { width: 32px; height: 32px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lockScreen" style="position:fixed;inset:0;background:#1a1a1a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
        <div style="text-align:center;margin-bottom:30px;">
            <div style="width:80px;height:80px;background:#facc15;border-radius:20px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:30px;">🔒</div>
            <h2 style="font-size:24px;color:white;">KHATA PRO</h2>
            <p id="lockScreenSubtitle" style="color:#facc15;font-size:14px;margin-top:5px;">🔐 Enter Secure PIN</p>
        </div>
        <div style="display:flex;gap:10px;margin-bottom:20px;">
            <div id="dot-0" class="lock-dot"></div>
            <div id="dot-1" class="lock-dot"></div>
            <div id="dot-2" class="lock-dot"></div>
            <div id="dot-3" class="lock-dot"></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;width:100%;">
            <button onclick="pressKey('1')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">1</button>
            <button onclick="pressKey('2')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">2</button>
            <button onclick="pressKey('3')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">3</button>
            <button onclick="pressKey('4')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">4</button>
            <button onclick="pressKey('5')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">5</button>
            <button onclick="pressKey('6')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">6</button>
            <button onclick="pressKey('7')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">7</button>
            <button onclick="pressKey('8')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">8</button>
            <button onclick="pressKey('9')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">9</button>
            <button onclick="clearCurrentPin()" style="border-radius:12px;background:rgba(255,0,0,0.2);color:#ff6b6b;font-size:14px;border:1px solid rgba(255,0,0,0.3);">CLR</button>
            <button onclick="pressKey('0')" style="aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.1);color:white;font-size:24px;border:1px solid rgba(255,255,255,0.2);">0</button>
            <button onclick="fullResetApp()" style="border-radius:12px;background:rgba(255,0,0,0.2);color:#ff6b6b;font-size:14px;border:1px solid rgba(255,0,0,0.3);">RESET</button>
        </div>
        <div style="margin-top:20px;color:#666;font-size:12px;">KHATA PREMIUM v8.0</div>
    </div>

    <!-- Main App -->
    <div id="mainApp">
        <!-- Header -->
        <div class="header-premium" style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:10px;">
                <button id="backBtn" onclick="goHome()" style="display:none;background:none;border:none;color:#facc15;font-size:20px;cursor:pointer;">‹</button>
                <h1 id="pageTitle" style="font-size:16px;font-weight:bold;">KHATA PRO</h1>
            </div>
            <div style="display:flex;gap:5px;">
                <button onclick="openSettings()" style="background:rgba(255,255,255,0.2);border:none;color:#facc15;border-radius:8px;width:36px;height:36px;cursor:pointer;">⚙️</button>
                <button onclick="toggleTheme()" style="background:rgba(255,255,255,0.2);border:none;color:#facc15;border-radius:8px;width:36px;height:36px;cursor:pointer;">🌙</button>
                <button onclick="lockApp()" style="background:rgba(255,255,255,0.2);border:none;color:#facc15;border-radius:8px;width:36px;height:36px;cursor:pointer;">🔒</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            
            <!-- Home View -->
            <div id="homeWorkspaceView">
                <!-- Dashboard -->
                <div class="premium-card">
                    <div class="dashboard-grid">
                        <div class="dashboard-item">
                            <div style="font-size:24px;color:#2e7d32;">💰</div>
                            <div class="value" id="dashTotalBalance" style="color:#2e7d32;">₹0</div>
                            <div class="label">Balance</div>
                        </div>
                        <div class="dashboard-item">
                            <div style="font-size:24px;color:#d97706;">📅</div>
                            <div class="value" id="dashPromises" style="color:#d97706;">0</div>
                            <div class="label">Promises</div>
                        </div>
                        <div class="dashboard-item">
                            <div style="font-size:24px;color:#1e40af;">📈</div>
                            <div class="value" id="dashIncome" style="color:#1e40af;">₹0</div>
                            <div class="label">Income (M)</div>
                        </div>
                        <div class="dashboard-item">
                            <div style="font-size:24px;color:#dc2626;">📉</div>
                            <div class="value" id="dashExpense" style="color:#dc2626;">₹0</div>
                            <div class="label">Expense (M)</div>
                        </div>
                    </div>
                </div>

                <!-- Search -->
                <div style="margin-bottom:10px;">
                    <input type="text" id="searchInput" oninput="searchQuery=this.value;renderClientListFeed()" placeholder="🔍 Search clients..." class="input-premium">
                </div>

                <!-- Client List -->
                <div id="mainClientListContainer"></div>
            </div>

            <!-- Ledger View -->
            <div id="ledgerWorkspaceView" class="hidden">
                <div id="topArea" style="margin-bottom:10px;"></div>
                <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
                    <button onclick="setLedgerTypeFilter('ALL')" class="btn-premium" style="padding:5px 15px;font-size:12px;">All</button>
                    <button onclick="setLedgerTypeFilter('GAVE')" class="btn-premium" style="padding:5px 15px;font-size:12px;background:#dc2626;">Gave</button>
                    <button onclick="setLedgerTypeFilter('GOT')" class="btn-premium" style="padding:5px 15px;font-size:12px;background:#16a34a;">Got</button>
                    <button onclick="toggleDateFilterDrawer()" style="padding:5px 15px;background:#facc15;border:none;border-radius:8px;cursor:pointer;">📅 Filter</button>
                </div>
                <div id="dateFilterDrawer" class="hidden" style="margin-bottom:10px;padding:10px;background:white;border-radius:8px;">
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <input type="date" id="filterStartDate" onchange="renderDetails()" class="input-premium" style="width:auto;padding:5px;">
                        <span>to</span>
                        <input type="date" id="filterEndDate" onchange="renderDetails()" class="input-premium" style="width:auto;padding:5px;">
                        <button onclick="clearDateRangeFilters()" style="background:#dc2626;color:white;border:none;padding:5px 15px;border-radius:8px;cursor:pointer;">Clear</button>
                    </div>
                </div>
                <div id="dailyRow" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;"></div>
                <div style="overflow-y:auto;max-height:400px;">
                    <table>
                        <thead style="background:#f0f0f0;position:sticky;top:0;">
                            <tr>
                                <th class="col-date">Date &amp; Note</th>
                                <th class="col-gave">Gave</th>
                                <th class="col-got">Got</th>
                                <th class="col-balance">Balance</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerItemsRowsContainer"></tbody>
                    </table>
                </div>
            </div>

            <!-- Income / Expense View -->
            <div id="incomeExpenseWorkspaceView" class="hidden">
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <button id="incomeTabBtn" onclick="switchIETab('income')" class="btn-premium" style="flex:1;">💰 INCOME</button>
                    <button id="expenseTabBtn" onclick="switchIETab('expense')" class="btn-premium" style="flex:1;background:#9ca3af;">💸 EXPENSE</button>
                </div>
                <div class="premium-card">
                    <div style="display:flex;justify-content:space-between;text-align:center;">
                        <div style="flex:1;"><div style="font-size:12px;color:#666;">INCOME</div><div id="totalIncomeAmt" style="font-size:20px;font-weight:bold;color:#16a34a;">₹0</div></div>
                        <div style="flex:1;border-left:1px solid #ddd;border-right:1px solid #ddd;"><div style="font-size:12px;color:#666;">EXPENSE</div><div id="totalExpenseAmt" style="font-size:20px;font-weight:bold;color:#dc2626;">₹0</div></div>
                        <div style="flex:1;"><div style="font-size:12px;color:#666;">BALANCE</div><div id="totalBalanceAmt" style="font-size:20px;font-weight:bold;color:#1e40af;">₹0</div></div>
                    </div>
                </div>
                <div class="premium-card">
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <input type="date" id="ieFilterDate" class="input-premium" style="flex:1;min-width:80px;padding:5px;" onchange="renderIncomeExpenseList()">
                        <select id="ieFilterMonth" class="input-premium" style="flex:1;min-width:80px;padding:5px;" onchange="renderIncomeExpenseList()">
                            <option value="">All Months</option>
                            <option value="2025-01">Jan 2025</option>
                            <option value="2025-02">Feb 2025</option>
                            <option value="2025-03">Mar 2025</option>
                            <option value="2025-04">Apr 2025</option>
                            <option value="2025-05">May 2025</option>
                            <option value="2025-06">Jun 2025</option>
                            <option value="2025-07">Jul 2025</option>
                            <option value="2025-08">Aug 2025</option>
                            <option value="2025-09">Sep 2025</option>
                            <option value="2025-10">Oct 2025</option>
                            <option value="2025-11">Nov 2025</option>
                            <option value="2025-12">Dec 2025</option>
                        </select>
                        <input type="text" id="ieSearchInput" placeholder="Search..." class="input-premium" style="flex:1;min-width:80px;padding:5px;" oninput="renderIncomeExpenseList()">
                        <button onclick="clearIEFilters()" style="background:#dc2626;color:white;border:none;padding:5px 15px;border-radius:8px;cursor:pointer;">✖</button>
                    </div>
                </div>
                <div id="categorySummaryContainer" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;"></div>
                <button id="addIeBtn" onclick="openAddIncomeModal()" class="btn-premium" style="width:100%;margin-bottom:10px;">+ ADD INCOME</button>
                <div id="ieListContainer"></div>
            </div>

            <!-- Memo View -->
            <div id="memoWorkspaceView" class="hidden">
                <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                    <h2 style="font-size:18px;">📝 My Reminders</h2>
                    <div style="display:flex;gap:5px;">
                        <button onclick="toggleAlarm()" style="background:#666;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;">🔔 <span id="alarmStatus">ON</span></button>
                        <button onclick="openAddReminderModal()" style="background:#7c3aed;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;">+ Add</button>
                    </div>
                </div>
                <div id="remindersListContainer"></div>
                <button onclick="checkAlarmManually()" style="width:100%;background:#facc15;color:black;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;">🔔 CHECK ALARM NOW</button>
            </div>

            <!-- Vehicle View -->
            <div id="vehicleWorkspaceView" class="hidden">
                <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                    <h2 style="font-size:18px;">🚗 Vehicle Expenses</h2>
                    <button onclick="openAddVehicleExpenseModal()" style="background:#2563eb;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;">+ Add</button>
                </div>
                <div class="premium-card">
                    <div style="font-size:12px;color:#666;">TOTAL EXPENSES</div>
                    <div id="totalVehicleExpense" style="font-size:24px;font-weight:bold;">₹0</div>
                </div>
                <div id="vehicleExpensesList"></div>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchView('home')" id="navHome">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="switchView('income')" id="navIncome">
                <i class="fa-solid fa-circle-dollar-to-slot"></i>
                <span>Income</span>
            </div>
            <div class="nav-item" onclick="openQuickAddMenu()" id="navAdd" style="background:#facc15;border-radius:12px;padding:5px 15px;">
                <i class="fa-solid fa-plus"></i>
                <span>Add</span>
            </div>
            <div class="nav-item" onclick="switchView('memo')" id="navMemo">
                <i class="fa-regular fa-sticky-note"></i>
                <span>Memo</span>
            </div>
            <div class="nav-item" onclick="switchView('vehicle')" id="navVehicle">
                <i class="fa-solid fa-car"></i>
                <span>Vehicle</span>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal()">
        <div id="modalBox" class="modal-premium" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        // ==================== DATA LAYER ====================
        const STORAGE_ID = 'KHATA_PRO_PREMIUM_V8';
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { 
            customers: [], trans: [], promises: [], reminders: [], vehicleExpenses: [],
            incomes: [], expenses: [],
            pin: '', upi: '', darkMode: false, theme: 'green', alarmEnabled: true,
            alarmFile: null 
        };
        let activeCid = null, currentPinInput = "", searchQuery = "", currentLedgerTypeFilter = "ALL", tempFirstSetupPin = "";
        let currentIETab = "income";
        let currentQRAmount = 0;
        let reminderCheckInterval = null;

        const saveDB = () => { 
            try {
                localStorage.setItem(STORAGE_ID, JSON.stringify(db)); 
                console.log('Data saved');
                renderAll();
            } catch(e) {
                console.error('Save error:', e);
            }
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        const fmtDate = (d) => d ? d.split('-').reverse().join('/') : '';

        // ==================== NAVIGATION ====================
        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('homeWorkspaceView').classList.add('hidden');
            document.getElementById('ledgerWorkspaceView').classList.add('hidden');
            document.getElementById('incomeExpenseWorkspaceView').classList.add('hidden');
            document.getElementById('memoWorkspaceView').classList.add('hidden');
            document.getElementById('vehicleWorkspaceView').classList.add('hidden');
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('custEditBtn')?.style.display = 'none';
            
            if(view === 'home') {
                document.getElementById('homeWorkspaceView').classList.remove('hidden');
                document.getElementById('pageTitle').textContent = 'KHATA PRO';
                document.getElementById('navHome').classList.add('active');
                renderClientListFeed();
            } else if(view === 'income') {
                document.getElementById('incomeExpenseWorkspaceView').classList.remove('hidden');
                document.getElementById('pageTitle').textContent = '💰 INCOME';
                document.getElementById('navIncome').classList.add('active');
                renderIncomeExpenseList();
            } else if(view === 'memo') {
                document.getElementById('memoWorkspaceView').classList.remove('hidden');
                document.getElementById('pageTitle').textContent = '📝 MEMO';
                document.getElementById('navMemo').classList.add('active');
                renderReminders();
            } else if(view === 'vehicle') {
                document.getElementById('vehicleWorkspaceView').classList.remove('hidden');
                document.getElementById('pageTitle').textContent = '🚗 VEHICLE';
                document.getElementById('navVehicle').classList.add('active');
                renderVehicleExpenses();
            }
        }

        function goHome() { 
            activeCid = null; 
            switchView('home');
        }

        function openCustomer(id) { 
            activeCid = id; 
            currentLedgerTypeFilter = "ALL"; 
            document.getElementById('homeWorkspaceView').classList.add('hidden'); 
            document.getElementById('ledgerWorkspaceView').classList.remove('hidden'); 
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('pageTitle').textContent = db.customers.find(c => c.id === id)?.name || "Customer"; 
            renderDetails(); 
            renderDashboard(); 
        }

        // ==================== THEME ====================
        function toggleTheme() { 
            db.darkMode = !db.darkMode; 
            document.body.style.background = db.darkMode ? '#1a1a1a' : '#f5f5f5';
            document.body.style.color = db.darkMode ? 'white' : 'black';
            document.getElementById('themeIcon').textContent = db.darkMode ? '☀️' : '🌙';
            saveDB(); 
        }

        // ==================== LOCK ====================
        function pressKey(n) { if(currentPinInput.length < 4) { currentPinInput += n; updateDots(); if(currentPinInput.length === 4) setTimeout(checkPin, 150); } }
        function clearCurrentPin() { currentPinInput = ""; updateDots(); }
        function updateDots() { for(let i=0;i<4;i++){ const el=document.getElementById(`dot-${i}`); if(el) { if(i<currentPinInput.length){ el.className = 'lock-dot active'; } else { el.className = 'lock-dot'; } } } }
        function checkPin() {
            if(!db.pin || db.pin === '') {
                if(!tempFirstSetupPin) { 
                    tempFirstSetupPin = currentPinInput; 
                    currentPinInput = ""; 
                    updateDots(); 
                    document.getElementById('lockScreenSubtitle').textContent = "✅ Confirm new PIN"; 
                    return; 
                } else { 
                    if(currentPinInput === tempFirstSetupPin) { 
                        db.pin = currentPinInput; 
                        tempFirstSetupPin = ""; 
                        saveDB(); 
                        alert("✅ PIN Activated"); 
                        document.getElementById('lockScreen').style.display = 'none'; 
                        document.getElementById('mainApp').style.display = 'flex'; 
                        requestNotificationPermission(); 
                        startReminderChecker(); 
                        renderAll(); 
                    } else { 
                        alert("❌ PIN mismatch"); 
                        tempFirstSetupPin = ""; 
                        currentPinInput = ""; 
                        updateDots(); 
                        document.getElementById('lockScreenSubtitle').textContent = "Create 4-digit PIN"; 
                    } 
                    return; 
                }
            }
            if(currentPinInput === db.pin) { 
                document.getElementById('lockScreen').style.display = 'none'; 
                document.getElementById('mainApp').style.display = 'flex'; 
                requestNotificationPermission();

        function playAlarmSound() {
            if(!db.alarmEnabled) return;
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                oscillator.start();
                setTimeout(() => {
                    oscillator.frequency.setValueAtTime(660, audioContext.currentTime);
                }, 200);
                setTimeout(() => {
                    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                }, 400);
                setTimeout(() => {
                    oscillator.stop();
                }, 600);
            } catch(e) { console.log('Audio error:', e); }
        }

        function checkAlarmManually() {
            const now = new Date();
            const currentTime = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            let found = false;
            if (!db.reminders) return;
            db.reminders.forEach(rem => {
                if (rem.alertSent) return;
                if (rem.dueDate === getToday() && rem.dueTime <= currentTime) {
                    playAlarmSound();
                    rem.alertSent = true;
                    found = true;
                    saveDB();
                    alert('🔔 ALARM TRIGGERED!\n' + rem.title);
                }
            });
            if (!found) alert('No pending alarms.');
        }

        function backgroundAlarmCheck() {
            if (!db.reminders) return;
            const now = new Date();
            const currentTime = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            db.reminders.forEach(rem => {
                if (rem.alertSent) return;
                if (rem.dueDate === getToday() && rem.dueTime <= currentTime) {
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('🔔 KHATA PRO Reminder', { body: `${rem.title}\nTime's up!`, icon: '🔔' });
                    }
                    playAlarmSound();
                    rem.alertSent = true;
                    saveDB();
                }
            });
        }

            let incomes = [...(db.incomes || [])], expenses = [...(db.expenses || [])];

        function renderReminders() { 
            if (!db.reminders) db.reminders = []; 
            const now = new Date(); 
            const sorted = [...db.reminders].sort((a,b) => new Date(a.dueDate + 'T' + a.dueTime) - new Date(b.dueDate + 'T' + b.dueTime)); 
            let html = ''; 
            sorted.forEach(rem => { 
                const dueDateTime = new Date(rem.dueDate + 'T' + rem.dueTime);
                const daysLeft = Math.ceil((dueDateTime - now) / (1000*60*60*24));
                let statusClass = '', statusText = ''; 
                if (daysLeft < 0) { 
                    statusClass = 'background:#991b1b;color:white;'; 
                    statusText = '⚠️ OVERDUE'; 
                } else if (daysLeft <= 1) { 
                    statusClass = 'background:#dc2626;color:white;'; 
                    statusText = '🔴 TODAY'; 
                } else if (daysLeft <= 3) { 
                    statusClass = 'background:#ea580c;color:white;'; 
                    statusText = '🟡 ' + daysLeft + ' days'; 
                } else { 
                    statusClass = 'background:#16a34a;color:white;'; 
                    statusText = '🟢 ' + daysLeft + ' days'; 
                } 
                html += `
                    <div class="premium-card" style="${statusClass}padding:10px;cursor:pointer;" onclick="openEditReminderModal(${rem.id})">
                        <div style="display:flex;justify-content:space-between;">

        function shareQRToWhatsApp() { 
            const qrElement = document.getElementById("qr-container"); 
            if(!qrElement) return; 
            html2canvas(qrElement, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => { 
                canvas.toBlob(blob => { 
                    const file = new File([blob], 'qr_code.png', { type: 'image/png' }); 
                    if (navigator.share) { 
                        navigator.share({
                            title: 'Payment QR Code', 
                            text: `Payment Request: ₹${currentQRAmount}`, 
                            files: [file] 
                        }).catch(() => fallbackWhatsAppShare()); 
                    } else { 
                        fallbackWhatsAppShare(); 
                    } 
                }); 
            }).catch(() => fallbackWhatsAppShare()); 
            function fallbackWhatsAppShare() { 
                const cust = db.customers.find(c => c.id === activeCid); 
                const phone = cust?.phone; 
                let waUrl = ''; 
                if(phone && phone !== '-') { 
                    let cleanPhone = phone.replace(/\D/g, ''); 
                    if(cleanPhone.length === 10) cleanPhone = '91' + cleanPhone; 
                    waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(`💰 Payment Request\nAmount: ₹${currentQRAmount}\nUPI: ${db.upi}`)}`; 
                } else { 
                    waUrl = `https://wa.me/?text=${encodeURIComponent(`💰 Payment Request\nAmount: ₹${currentQRAmount}\nUPI: ${db.upi}`)}`; 
                } 
                window.open(waUrl, '_blank'); 
            } 
            closeModal(); 
        }

        function generatePrintA4() {

            const filtered = db.trans.filter(t => t.cid === activeCid && t.date >= s && t.date <= e).sort((a,b) => new Date(a.date) - new Date(b.date));

                return `<tr><td>${fmtDate(t.date)}<br>${t.rem || ''}</td><td>${t.type === 'GAVE' ? '₹'+t.amt.toFixed(2) : '-'}</td><td>${t.type === 'GOT' ? '₹'+t.amt.toFixed(2) : '-'}</td><td>₹${Math.abs(rt).toFixed(2)}</td></tr>`; 
            }).join('');

            const filtered = db.trans.filter(t => t.cid === activeCid && t.date >= s && t.date <= e).sort((a,b) => new Date(a.date) - new Date(b.date)); 
            const el = document.createElement('div'); 
            el.style.padding = '15px'; 
            el.style.background = '#fff'; 
            let rt = 0; 
            let rows = filtered.map(t => { 
                rt += (t.type === 'GAVE' ? t.amt : -t.amt); 
                return `<tr><td style="border:1px solid #ccc;padding:5px;font-size:11px">${fmtDate(t.date)}</td><td style="border:1px solid #ccc">${t.type === 'GAVE' ? '₹'+t.amt.toFixed(2) : '-'}</td><td style="border:1px solid #ccc">${t.type === 'GOT' ? '₹'+t.amt.toFixed(2) : '-'}</td><td style="border:1px solid #ccc">₹${rt.toFixed(2)}</td></tr>`; 
            }).join(''); 
            el.innerHTML = `<h2 style="text-align:center;font-size:16px">KHATA PRO</h2><p><strong>${cust.name}</strong> | ${cust.phone || ''}</p><p>Period: ${fmtDate(s)} - ${fmtDate(e)}</p><table style="width:100%;border-collapse:collapse">${rows}</table><h3 style="margin-top:10px">Closing: ₹${Math.abs(rt).toFixed(2)}</h3>`; 
            html2pdf().set({margin:0.5,filename:`${cust.name}_statement.pdf`}).from(el).save(); 
        }

        // ==================== SETTINGS ====================
        function openSettings() { 
            openModal(`
                <h2 style="font-size:18px;font-weight:bold;text-align:center;margin-bottom:10px;">⚙️ SETTINGS</h2>
                <div style="margin-bottom:10px;">
                    <label style="font-size:12px;font-weight:bold;">UPI ID</label>
                    <input id="upiI" class="input-premium" value="${db.upi || ''}" placeholder="example@okhdfcbank">
                </div>
                <div style="margin-bottom:10px;">
                    <label style="font-size:12px;font-weight:bold;">4-DIGIT PIN</label>
                    <input id="pinI" type="password" maxlength="4" class="input-premium" value="${db.pin || ''}" placeholder="****">
                </div>
                <button onclick="saveSettings()" class="btn-premium" style="width:100%;">💾 SAVE</button>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px;">
                    <button onclick="exportData()" style="background:#059669;color:white;border:none;padding:8px;border-radius:8px;cursor:pointer;">📁 BACKUP</button>
                    <button onclick="document.getElementById('imp').click()" style="background:#7c3aed;color:white;border:none;padding:8px;border-radius:8px;cursor:pointer;">🔄 RESTORE</button>
                </div>
                <input type="file" id="imp" style="display:none;" onchange="importData(event)">
                <button onclick="fullResetApp()" style="width:100%;background:#dc2626;color:white;border:none;padding:10px;border-radius:8px;margin-top:10px;cursor:pointer;">⚠️ DELETE ALL</button>
                <button onclick="closeModal()" style="width:100%;background:none;border:none;color:#666;padding:10px;cursor:pointer;">Close</button>
            `); 
        }
        function saveSettings() { 
            const newUpi = document.getElementById('upiI').value.trim(); 
            const newPin = document.getElementById('pinI').value; 
            if(newPin && newPin.length !== 4 && newPin.length !== 0) { 
                alert("PIN must be 4 digits"); 
                return; 
            } 
            db.upi = newUpi; 
            if(newPin && newPin.length === 4) db.pin = newPin; 
            saveDB(); 
            alert("✅ Settings saved!"); 
            closeModal(); 
        }
        function exportData() { 
            const blob = new Blob([JSON.stringify(db)], {type:'application/json'}); 
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = `khata_backup_${getToday()}.json`; 
            document.body.appendChild(a); 
            a.click(); 
            document.body.removeChild(a); 
            alert("✅ Backup downloaded!"); 
        }
        function importData(e) { 
            const reader = new FileReader(); 
            reader.onload = ev => { 
                try { 
                    const imported = JSON.parse(ev.target.result); 
                    if(!imported.customers || !imported.trans) {
                        alert("❌ Invalid backup file");
                        return;
                    }
                    db = imported; 
                    saveDB(); 
                    alert("✅ Restore successful! Reloading..."); 
                    location.reload(); 
                } catch(err) { 
                    alert("❌ Invalid backup file: " + err.message); 
                } 
            }; 
            reader.readAsText(e.target.files[0]); 
        }

        // ==================== ACTIONS HUB ====================
        function openActionsHubModal() { 
            const cust = db.customers.find(c => c.id === activeCid); 
            if(!cust) return; 
            let rb = 0; 
            db.trans.filter(t => t.cid === activeCid).forEach(t => rb += (t.type === 'GAVE' ? t.amt : -t.amt)); 
            openModal(`
                <h2 style="font-size:18px;font-weight:bold;text-align:center;margin-bottom:10px;">⚡ QUICK ACTIONS</h2>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;">
                    <button onclick="closeModal();shareWA('${cust.phone}',${rb.toFixed(2)})" style="background:#facc15;border:none;padding:10px;border-radius:8px;cursor:pointer;">📱 WA</button>
                    <button onclick="closeModal();openQR(${Math.abs(rb).toFixed(2)})" style="background:#facc15;border:none;padding:10px;border-radius:8px;cursor:pointer;">📱 QR</button>
                    <button onclick="closeModal();openPDFModal()" style="background:#facc15;border:none;padding:10px;border-radius:8px;cursor:pointer;">📄 PDF</button>
                    <button onclick="closeModal();openPrintModal()" style="background:#facc15;border:none;padding:10px;border-radius:8px;cursor:pointer;">🖨️ PRINT</button>
                    <button onclick="closeModal();toggleDateFilterDrawer()" style="background:#facc15;border:none;padding:10px;border-radius:8px;cursor:pointer;">📅 Filter</button>
                    <button onclick="closeModal();openPromiseModal()" style="background:#facc15;border:none;padding:10px;border-radius:8px;cursor:pointer;">⏰ Promise</button>
                </div>
                <button onclick="closeModal()" style="width:100%;background:none;border:none;color:#666;padding:10px;cursor:pointer;">Close</button>
            `); 
        }

        // ==================== QUICK ADD ====================
        function openQuickAddMenu() {
            openModal(`
                <h2 style="font-size:18px;font-weight:bold;text-align:center;margin-bottom:10px;">⚡ Quick Add</h2>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
                    <button onclick="closeModal();openCustModal()" class="btn-premium">👤 Client</button>
                    <button onclick="closeModal();openAdd('GAVE')" class="btn-premium" style="background:#dc2626;">📤 Gave</button>
                    <button onclick="closeModal();openAdd('GOT')" class="btn-premium" style="background:#16a34a;">📥 Got</button>
                    <button onclick="closeModal();openAddIncomeModal()" class="btn-premium" style="background:#16a34a;">💰 Income</button>
                    <button onclick="closeModal();openAddExpenseModal()" class="btn-premium" style="background:#dc2626;">💸 Expense</button>
                    <button onclick="closeModal();openAddReminderModal()" class="btn-premium" style="background:#7c3aed;">📝 Reminder</button>
                </div>
                <button onclick="closeModal()" style="width:100%;background:none;border:none;color:#666;padding:10px;cursor:pointer;">Cancel</button>
            `);
        }

        // ==================== CALCULATOR ====================
        let currentCalculatorInput = "0";
        function openCalculator() { 
            openModal(`
                <div id="calcDisplay">0</div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;">
                    <button onclick="calcInput('7')" class="calc-btn">7</button>
                    <button onclick="calcInput('8')" class="calc-btn">8</button>
                    <button onclick="calcInput('9')" class="calc-btn">9</button>
                    <button onclick="calcInput('/')" style="background:#facc15;border:none;padding:15px;border-radius:8px;font-size:20px;cursor:pointer;">÷</button>
                    <button onclick="calcInput('4')" class="calc-btn">4</button>
                    <button onclick="calcInput('5')" class="calc-btn">5</button>
                    <button onclick="calcInput('6')" class="calc-btn">6</button>
                    <button onclick="calcInput('*')" style="background:#facc15;border:none;padding:15px;border-radius:8px;font-size:20px;cursor:pointer;">×</button>
                    <button onclick="calcInput('1')" class="calc-btn">1</button>
                    <button onclick="calcInput('2')" class="calc-btn">2</button>
                    <button onclick="calcInput('3')" class="calc-btn">3</button>
                    <button onclick="calcInput('-')" style="background:#facc15;border:none;padding:15px;border-radius:8px;font-size:20px;cursor:pointer;">-</button>
                    <button onclick="calcInput('0')" class="calc-btn">0</button>
                    <button onclick="calcInput('00')" class="calc-btn">00</button>
                    <button onclick="calcInput('.')" class="calc-btn">.</button>
                    <button onclick="calcInput('+')" style="background:#facc15;border:none;padding:15px;border-radius:8px;font-size:20px;cursor:pointer;">+</button>
                    <button onclick="calcClear()" style="background:#dc2626;color:white;border:none;padding:15px;border-radius:8px;font-size:14px;cursor:pointer;grid-column:span 2;">AC</button>
                    <button onclick="calcDelete()" style="background:#f0f0f0;border:none;padding:15px;border-radius:8px;font-size:20px;cursor:pointer;">⌫</button>
                    <button onclick="calcEvaluate()" style="background:#2563eb;color:white;border:none;padding:15px;border-radius:8px;font-size:20px;cursor:pointer;">=</button>
                </div>
                <button onclick="useCalcResultInAdd()" class="btn-premium" style="width:100%;margin-top:10px;">✓ USE AMOUNT</button>
                <button onclick="closeModal()" style="width:100%;background:none;border:none;color:#666;padding:10px;cursor:pointer;">Cancel</button>
            `); 
            currentCalculatorInput = "0"; 
            updateCalcDisplay(); 
        }
        function calcInput(val) { 
            if (currentCalculatorInput === "0" && val !== "." && !isNaN(val)) currentCalculatorInput = val; 
            else currentCalculatorInput += val; 
            updateCalcDisplay(); 
        }
        function calcClear() { currentCalculatorInput = "0"; updateCalcDisplay(); }
        function calcDelete() { 
            currentCalculatorInput = currentCalculatorInput.slice(0, -1); 
            if (currentCalculatorInput === "") currentCalculatorInput = "0"; 
            updateCalcDisplay(); 
        }
        function updateCalcDisplay() { 
            document.getElementById("calcDisplay").textContent = currentCalculatorInput; 
        }
        function calcEvaluate() { 
            try { 
                let expr = currentCalculatorInput.replace(/×/g, '*').replace(/÷/g, '/'); 
                let result = eval(expr); 
                if (isNaN(result) || !isFinite(result)) throw new Error(); 
                currentCalculatorInput = result.toString(); 
                updateCalcDisplay(); 
            } catch(e) { 
                alert("Invalid calculation"); 
                calcClear(); 
            } 
        }
        function useCalcResultInAdd() { 
            let val = parseFloat(currentCalculatorInput); 
            if (isNaN(val)) val = 0; 
            const amtInput = document.getElementById('ta'); 
            if (amtInput) amtInput.value = val.toFixed(2); 
            closeModal(); 
        }

        // ==================== INIT ====================
        window.onload = () => { 
            if(db.darkMode) document.body.style.background = '#1a1a1a';
            document.getElementById('themeIcon').textContent = db.darkMode ? '☀️' : '🌙';
            if(db.alarmEnabled) document.getElementById('alarmStatus').textContent = 'ON';
            requestNotificationPermission();
            lockApp(); 
        };
    </script>
</body>
</html>
